[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tibris-cube-studio"
version = "2.0.0"
description = "Digital Cube and Tibris commission studio Telegram bot"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot==22.8", "python-dotenv==1.2.1", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
